services:
  speech-to-text:
    build: .
    # Set STT_IMAGE to the image CI publishes to Docker Hub (e.g. you/speech-to-text:latest)
    # to "docker compose pull" instead of building it.
    image: ${STT_IMAGE:-speech-to-text:latest}
    ports:
      - "8081:8081"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_PORT=8081
      # Speaker diarization: Hugging Face token with the pyannote model terms accepted.
      # Optional: the token can also be added from the web UI (saved in the model-cache volume).
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_DIARIZE=${WHISPER_DIARIZE:-false}
      # Transcript polish (optional): start the "ollama" service below with
      # "docker compose --profile polish up -d" and pull the model once (see README).
      # Without it the UI greys out the "Polish transcript" toggle; nothing else changes.
      - WHISPER_POLISH=${WHISPER_POLISH:-false}
      - POLISH_BASE_URL=${POLISH_BASE_URL:-http://ollama:11434/v1}
      - POLISH_MODEL=${POLISH_MODEL:-}
      - POLISH_TIMEOUT=${POLISH_TIMEOUT:-}
      # Paths inside the container: put the files in the model-cache volume (/root/.cache)
      - POLISH_DICTIONARY=${POLISH_DICTIONARY:-}
      - POLISH_LOG=${POLISH_LOG:-}
      # Only for a hosted endpoint; local Ollama needs no key. Set it in the shell or an
      # untracked env file, never in the tracked .env.
      - POLISH_API_KEY=${POLISH_API_KEY:-}
      # Internet-facing server (docs/DEPLOIEMENT_SERVEUR.md): access tokens, comma-separated,
      # and transcription requests per minute per token. Unset = no authentication (local use).
      # Set the tokens in the shell or an untracked env file, never in the tracked .env.
      - DICTEE_TOKENS=${DICTEE_TOKENS:-}
      - DICTEE_RATE_LIMIT=${DICTEE_RATE_LIMIT:-30}
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  # Local LLM for the transcript polish step, on the same GPU as Whisper.
  # Only started with the "polish" profile. Not published on the host: the app
  # reaches it as http://ollama:11434 on the compose network.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [polish]
    environment:
      # Keep the model in GPU memory between dictations (a reload costs seconds).
      # "Eject" in the UI still unloads it on demand.
      - OLLAMA_KEEP_ALIVE=-1
      # One user, one request at a time: a single slot keeps the KV cache small
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      # The polish prompt (rules + few-shots + up to 400 words) needs about 3k tokens;
      # older Ollama versions default to 2048 and would cut the prompt silently.
      - OLLAMA_CONTEXT_LENGTH=4096
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  model-cache:
  ollama-models:
