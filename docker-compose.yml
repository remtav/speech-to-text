version: "3.8"

services:
  speech-to-text:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
    volumes:
      - model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  model-cache:
