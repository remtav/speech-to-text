version: "3.8"

services:
  speech-to-text:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
      # Speaker diarization: Hugging Face token with the pyannote model terms accepted
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_DIARIZE=${WHISPER_DIARIZE:-false}
    volumes:
      - model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  model-cache:
