name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies (CPU torch)
        run: |
          uv venv --python 3.12
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0+cpu" "torchaudio==2.8.0+cpu" "torchvision==0.23.0+cpu" \
            -r requirements.txt pytest httpx

      - name: Run tests
        run: .venv/bin/python -m pytest tests -v

  # On every push to main (a merged PR), once tests pass: build the image and
  # push it to Docker Hub as <user>/speech-to-text. Needs the repository secrets
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (see README, "Pre-built image");
  # without them the job skips its steps.
  publish:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image
      cancel-in-progress: true
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Docker Hub secrets missing
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; image not published."
      - name: Free disk space (CUDA torch wheels need several GB)
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        if: env.HAS_DOCKERHUB == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/speech-to-text
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        if: env.HAS_DOCKERHUB == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the dependency layers of the previous image when the requirements did not change.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/speech-to-text:latest
          cache-to: type=inline
