name: Android

# Voice keyboard APK (android/, issue #10). Every check here is what a lot is
# accepted on: build, JVM unit tests, real-model tests on the CI host, and
# instrumented tests of the keyboard on an emulator. A push to main also
# publishes the APK as a GitHub release.

on:
  # Branches are covered by their pull request; a push only matters on main (release).
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Never cancel a run on main halfway through publishing the release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: android

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (includes the real sherpa-onnx VAD on the host)
        run: ./gradlew --no-daemon testDebugUnitTest -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
      - name: Release key from secrets
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.DICTEE_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "DICTEE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_RELEASE" = "true" ]; then
            # Never publish an unsigned or debug-signed APK: skip the release, loudly.
            echo "::warning::Release key secrets are not set: no release is published (see android/README.md, 'Clé de signature des releases')."
            echo "### No release published: the release key secrets are not set" >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release key (pull request or fork): the release APK is built unsigned."
          fi
      - name: Build APKs
        env:
          DICTEE_KEYSTORE_PASSWORD: ${{ secrets.DICTEE_KEYSTORE_PASSWORD }}
          DICTEE_KEY_ALIAS: ${{ secrets.DICTEE_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
      - name: Check signature and name the release APK
        run: |
          rm -f "$RUNNER_TEMP/release.p12"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
            # Never publish an APK signed with the public debug key.
            if grep -q "CN=Android Debug" signature.txt; then echo "::error::release signed with the debug key"; exit 1; fi
            cp app/build/outputs/apk/release/app-release.apk dictee-$VERSION_NAME.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dictee-$VERSION_NAME-unsigned.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dictee-apk
          path: android/dictee-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

  models:
    name: Model tests on the CI host (every catalogue model, FR + EN)
    runs-on: ubuntu-latest
    # Five models (~5,8 Go) downloaded again whenever the catalogue changes (cache key).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Model cache (keyed on the catalog checksums)
        uses: actions/cache@v4
        with:
          path: ~/dictee-models
          key: dictee-models-${{ hashFiles('android/app/src/main/java/io/github/remtav/dictee/stt/ModelCatalog.kt') }}
      - name: Download (via the app's downloader, SHA-256 checked), load and transcribe
        run: >
          ./gradlew --no-daemon testDebugUnitTest
          --tests '*ModelAccuracyHostTest*' --tests '*EndToEndHostTest*'
          -PmodelsDir=$HOME/dictee-models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-test-reports
          path: android/app/build/reports/tests/

  emulator:
    name: Instrumented keyboard tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          working-directory: android
          # Keep the app installed after the run so the screenshots can be pulled.
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true; s=$?; mkdir -p screenshots; adb pull /sdcard/Android/data/io.github.remtav.dictee/files/screenshots/. screenshots/ || true; exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports
          path: android/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/screenshots/

  release:
    name: Publish APK
    needs: [build, models, emulator]
    # Only with an APK signed by the private release key.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dictee-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: Kalmia Blabla ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: dictee-${{ env.VERSION_NAME }}.apk
          body: |
            Kalmia Blabla: a voice keyboard designed in Quebec, for the French spoken here. Your voice is transcribed on your phone and sent to no one by default; no account, no ads, no telemetry, and public source code anyone can read.
            Voice keyboard APK (issue #10), built from ${{ github.sha }}.
            Signed with the project's private release key: each release installs over the previous one, and an APK signed by anyone else is refused as an update.
            Install: download the APK on the phone, allow installs from this source, then open "Kalmia Blabla" to enable the keyboard and download a model.
