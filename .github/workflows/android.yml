name: Android

# Voice keyboard APK (android/, issue #10). Every check here is what a lot is
# accepted on: build, JVM unit tests, real-model tests on the CI host, and
# instrumented tests of the keyboard on an emulator. A push to main, or a manual
# run (Actions -> Android -> Run workflow) on main, also publishes the APK as a
# GitHub release; a manual run on any other branch only builds and tests.
# Publishing needs every job green, except on a manual run with "skip_slow_tests"
# checked: the model and emulator jobs are then skipped and the APK is published
# once the build job (unit tests, release signature) is green.
#
# Issue #76: on a pull request, the "changes" job picks the jobs from the files
# changed. Documentation only (*.md, android/docs/): nothing runs. Model tests:
# only when the transcription code, the catalogue or the build changes. Emulator:
# only when the app's code, resources or instrumented tests change. A skipped
# job counts as passed for required checks. A push to main and a manual run
# always run everything: a release never ships with fewer tests than before.

on:
  # Branches are covered by their pull request; a push only matters on main (release).
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      skip_slow_tests:
        description: "Publish without the model and emulator tests (they are skipped; the build, unit tests and signature still must pass)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  # Never cancel a run on main halfway through publishing the release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: android

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  changes:
    name: Pick the jobs from the changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.pick.outputs.build }}
      models: ${{ steps.pick.outputs.models }}
      emulator: ${{ steps.pick.outputs.emulator }}
    steps:
      - name: Changed files (pull request only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - "android/**"
              - ".github/workflows/android.yml"
              - ".github/scripts/test_durations.py"
            docs:
              - "android/**/*.md"
              - "android/docs/**"
            # Everything HostModelTest compiles against or reads (packages audio, dictation,
            # stt, text and what they import; CompareActivity.parseReferences; the references).
            models:
              - "android/app/src/main/java/io/github/remtav/dictee/audio/**"
              - "android/app/src/main/java/io/github/remtav/dictee/dictation/**"
              - "android/app/src/main/java/io/github/remtav/dictee/stt/**"
              - "android/app/src/main/java/io/github/remtav/dictee/text/**"
              - "android/app/src/main/java/io/github/remtav/dictee/ui/CompareActivity.kt"
              - "android/app/src/main/assets/reference/**"
              - "android/app/src/test/java/io/github/remtav/dictee/HostModelTest.kt"
              - "android/*.gradle.kts"
              - "android/app/*.gradle.kts"
              - "android/gradle.properties"
              - "android/gradle/**"
              - ".github/workflows/android.yml"
            # The app (code, resources, assets, manifest), the instrumented tests and their
            # assets (src/test/resources/polissage is an androidTest asset dir), the build.
            emulator:
              - "android/app/src/main/**"
              - "android/app/src/debug/**"
              - "android/app/src/androidTest/**"
              - "android/app/src/test/resources/polissage/**"
              - "android/*.gradle.kts"
              - "android/app/*.gradle.kts"
              - "android/gradle.properties"
              - "android/gradle/**"
              - "android/keystore/**"
              - ".github/workflows/android.yml"
              - ".github/scripts/test_durations.py"
      - name: Jobs to run
        id: pick
        working-directory: .
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          ANDROID_COUNT: ${{ steps.filter.outputs.android_count }}
          DOCS_COUNT: ${{ steps.filter.outputs.docs_count }}
          MODELS: ${{ steps.filter.outputs.models }}
          EMULATOR: ${{ steps.filter.outputs.emulator }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            # Push to main or manual run: everything (skip_slow_tests is handled by each job).
            build=true; models=true; emulator=true
          else
            # Docs are a subset of android/**: any other changed file is code.
            if [ "${ANDROID_COUNT:-0}" != "${DOCS_COUNT:-0}" ]; then build=true; else build=false; fi
            models=$MODELS; emulator=$EMULATOR
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "emulator=$emulator" >> "$GITHUB_OUTPUT"
          {
            echo "### Jobs picked from the changed files"
            echo "| Job | Runs |"
            echo "|---|---|"
            echo "| Build and unit tests | $build |"
            echo "| Model tests | $models |"
            echo "| Instrumented tests (emulator) | $emulator |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and unit tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (includes the real sherpa-onnx VAD on the host)
        run: ./gradlew --no-daemon testDebugUnitTest -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
      - name: Release key from secrets
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.DICTEE_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "DICTEE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_RELEASE" = "true" ]; then
            # Never publish an unsigned or debug-signed APK: skip the release, loudly.
            echo "::warning::Release key secrets are not set: no release is published (see android/README.md, 'Clé de signature des releases')."
            echo "### No release published: the release key secrets are not set" >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release key (pull request or fork): the release APK is built unsigned."
          fi
      - name: Build APKs and the Play Store bundle
        env:
          DICTEE_KEYSTORE_PASSWORD: ${{ secrets.DICTEE_KEYSTORE_PASSWORD }}
          DICTEE_KEY_ALIAS: ${{ secrets.DICTEE_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
      - name: Check signature and name the release APK and bundle
        run: |
          rm -f "$RUNNER_TEMP/release.p12"
          # Play Store bundle (.aab): Play refuses APKs for new apps. Signed with the same
          # private key, which Play uses as the upload key (see android/README.md, "Play Store").
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            jarsigner -verify -certs "$AAB" | tee aab-signature.txt
            grep -q "jar verified" aab-signature.txt || { echo "::error::bundle is not signed"; exit 1; }
            if grep -q "CN=Android Debug" aab-signature.txt; then echo "::error::bundle signed with the debug key"; exit 1; fi
            cp "$AAB" dictee-$VERSION_NAME.aab
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
            # Never publish an APK signed with the public debug key.
            if grep -q "CN=Android Debug" signature.txt; then echo "::error::release signed with the debug key"; exit 1; fi
            cp app/build/outputs/apk/release/app-release.apk dictee-$VERSION_NAME.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dictee-$VERSION_NAME-unsigned.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dictee-apk
          path: android/dictee-*.apk
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: dictee-aab
          path: android/dictee-*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

  models:
    name: Model tests on the CI host (every catalogue model, FR + EN)
    needs: changes
    if: ${{ needs.changes.outputs.models == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_slow_tests) }}
    runs-on: ubuntu-latest
    # Five models (~5,8 Go) downloaded again whenever the catalogue changes (cache key).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Model cache (keyed on the catalog checksums)
        uses: actions/cache@v4
        with:
          path: ~/dictee-models
          key: dictee-models-${{ hashFiles('android/app/src/main/java/io/github/remtav/dictee/stt/ModelCatalog.kt') }}
      - name: Download (via the app's downloader, SHA-256 checked), load and transcribe
        run: >
          ./gradlew --no-daemon testDebugUnitTest
          --tests '*ModelAccuracyHostTest*' --tests '*EndToEndHostTest*'
          -PmodelsDir=$HOME/dictee-models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-test-reports
          path: android/app/build/reports/tests/

  emulator:
    # Issue #76: the ~130 instrumented tests (10-11 min alone) are split over three
    # emulators running side by side, by whole classes (a class keeps its order and
    # its setup). Shards 1 and 2 name their classes, about a third of the time each
    # (measured on PR #93); shard 3 runs every OTHER class, so a new test class always
    # runs, and a class renamed without updating this list fails loudly (class not
    # found) instead of being skipped. Rebalance with the "Test duration per class"
    # table of each shard's summary. Room for #70 (3-button navigation bar): add a
    # dimension to this matrix, or a shard, rather than lengthening one emulator.
    name: Instrumented keyboard tests (emulator ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.emulator == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_slow_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Classes of shards 1 and 2 (package io.github.remtav.dictee); shard 3 = all the others.
      SHARD1_CLASSES: TextKeyboardInstrumentedTest ReadingTestInstrumentedTest DictationEndToEndTest ServerModeInstrumentedTest
      SHARD2_CLASSES: ScreenshotTest HowToInstrumentedTest ContributionInstrumentedTest SetupLanguageTest VoiceCommandInstrumentedTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Classes of this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          qualify() { for c in $1; do printf 'io.github.remtav.dictee.%s,' "$c"; done | sed 's/,$//'; }
          case "$SHARD" in
            1) filter="class=$(qualify "$SHARD1_CLASSES")" ;;
            2) filter="class=$(qualify "$SHARD2_CLASSES")" ;;
            3) filter="notClass=$(qualify "$SHARD1_CLASSES $SHARD2_CLASSES")" ;;
          esac
          echo "Shard $SHARD: $filter"
          echo "SHARD_ARGS=-Pandroid.testInstrumentationRunnerArguments.$filter" >> "$GITHUB_ENV"
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      # Issue #76: the booted AVD is cached as a snapshot (pattern documented by
      # android-emulator-runner); the test run starts from it and saves nothing back.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6-4096M-v1
      - name: Create the AVD and its snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          working-directory: android
          script: echo "AVD snapshot generated for the cache."
      - name: Run instrumented tests (shard ${{ matrix.shard }}/3)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          working-directory: android
          # Keep the app installed after the run so the screenshots can be pulled.
          # hide_error_dialogs (issue #69): a loaded emulator often shows « Pixel Launcher isn't responding »;
          # the box took the window focus from the test field and failed keyboard tests at random. With it set,
          # Android closes the stuck launcher instead of showing the box (the CI emulator only, never a phone).
          # One line on purpose: the action runs each line of the script as its own command.
          script: adb shell settings put global hide_error_dialogs 1; ./gradlew --no-daemon connectedDebugAndroidTest $SHARD_ARGS -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true; s=$?; mkdir -p screenshots; adb pull /sdcard/Android/data/io.github.remtav.dictee/files/screenshots/. screenshots/ || true; exit $s
      - name: Test duration per class
        if: always()
        working-directory: .
        run: python3 .github/scripts/test_durations.py "Instrumented tests, shard ${{ matrix.shard }}/3" android/app/build/outputs/androidTest-results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports-${{ matrix.shard }}
          path: android/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.shard }}
          path: android/screenshots/

  release:
    name: Publish APK
    needs: [changes, build, models, emulator]
    # Only on main (push or manual run, never a pull request), and only with an
    # APK signed by the private release key. !cancelled() lets a manual run skip
    # the slow jobs (skipped needs), but a cancelled run never publishes.
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.build.result == 'success'
      && needs.build.outputs.signed == 'true'
      && ((needs.models.result == 'success' && needs.emulator.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.skip_slow_tests))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Say when the slow tests did not pass
        if: needs.models.result != 'success' || needs.emulator.result != 'success'
        working-directory: .
        run: |
          echo "::warning::Published without the model and emulator tests (manual run, skip_slow_tests)."
          echo "### Published without the model and emulator tests (manual run)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: dictee-apk
      - uses: actions/download-artifact@v4
        with:
          name: dictee-aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: Kalmia Blabla ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            dictee-${{ env.VERSION_NAME }}.apk
            dictee-${{ env.VERSION_NAME }}.aab
          body: |
            Kalmia Blabla: a voice keyboard designed in Quebec, for the French spoken here. Your voice is transcribed on your phone and sent to no one by default; no account, no ads, no telemetry, and public source code anyone can read.
            Voice keyboard APK (issue #10), built from ${{ github.sha }}.
            Signed with the project's private release key: each release installs over the previous one, and an APK signed by anyone else is refused as an update.
            The .aab file is the bundle for the Play Console; to install on a phone, use the .apk.
            Install: download the APK on the phone, allow installs from this source, then open "Kalmia Blabla" to enable the keyboard and download a model.
